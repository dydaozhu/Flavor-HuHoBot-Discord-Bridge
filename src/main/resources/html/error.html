<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>Error</title>
  <style>
    body { margin: 0; padding: 0; background: #313338; color: #f2f3f5; font-family: "Noto Sans SC", sans-serif; }
    .page { width: 592px; height: 180px; padding: 24px; }
    .card { background: #2b2d31; border: 1px solid #6b3034; padding: 22px; }
    .title { color: #ed4245; font-size: 24px; font-weight: bold; }
    .message { color: #b5bac1; font-size: 14px; margin-top: 10px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="title">{{TITLE}}</div>
      <div class="message">{{MESSAGE}}</div>
    </div>
  </div>
</body>
</html>
