<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="zh-CN">
<head>
  <meta charset="utf-8"/>
  <title>Whitelist</title>
  <style>
    body { margin: 0; padding: 0; background: #313338; color: #f2f3f5; font-family: "Noto Sans SC", sans-serif; }
    .page { width: 856px; padding: 18px 22px; }
    .card { background: #2b2d31; border: 1px solid #3f4147; padding: 18px; }
    .title { font-size: 26px; font-weight: bold; }
    .sub { color: #b5bac1; font-size: 14px; margin-top: 4px; }
    .page-no { float: right; color: #b5bac1; font-size: 13px; }
    .players { width: 100%; margin-top: 14px; border-collapse: collapse; }
    .player { background: #232428; border: 1px solid #3f4147; padding: 8px; width: 25%; }
    .head { width: 32px; height: 32px; }
    .name { font-size: 13px; color: #f2f3f5; padding-left: 8px; }
    .empty { color: #b5bac1; font-size: 14px; margin-top: 14px; }
    .footer { margin-top: 12px; color: #949ba4; font-size: 12px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <div class="page-no">{{PAGE}}</div>
      <div class="title">{{TITLE}}</div>
      <div class="sub">{{COUNT}}</div>
      {{PLAYERS}}
      {{EMPTY}}
      <div class="footer">{{FOOTER}}</div>
    </div>
  </div>
</body>
</html>
